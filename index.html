<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#05060a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Lissajous</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="vignette"></div>

    <header class="top ui" id="top">
      <div class="brand">Lissajous</div>
      <div class="now">
        <span class="now-name" id="nowName">Quinte</span>
        <span class="now-ratio" id="nowRatio">2 : 3</span>
      </div>
    </header>

    <div class="axislabel ui" id="labA"></div>
    <div class="axislabel ui" id="labB"></div>


    <button class="icon setbtn ui" id="setBtn" title="Einstellungen">
      <svg viewBox="0 0 24 24"><line x1="21" x2="14" y1="4" y2="4" /><line x1="10" x2="3" y1="4" y2="4" /><line x1="21" x2="12" y1="12" y2="12" /><line x1="8" x2="3" y1="12" y2="12" /><line x1="21" x2="16" y1="20" y2="20" /><line x1="12" x2="3" y1="20" y2="20" /><line x1="14" x2="14" y1="2" y2="6" /><line x1="8" x2="8" y1="10" y2="14" /><line x1="16" x2="16" y1="18" y2="22" /></svg>
    </button>

    <aside class="sheet" id="sheet" hidden>
      <div class="sheet-head">
        <span>Einstellungen</span>
        <button class="icon" id="sheetClose" title="Schließen">
          <svg viewBox="0 0 24 24"><line x1="6" x2="18" y1="6" y2="18" /><line x1="18" x2="6" y1="6" y2="18" /></svg>
        </button>
      </div>

      <div class="group">
        <div class="glbl">Farbe</div>
        <div class="swatches" id="swatches"></div>
      </div>

      <div class="group">
        <div class="glbl">Klang</div>
        <div class="seg small full" id="klangSeg"></div>
      </div>

      <div class="group">
        <button class="pill check row-check" id="axisBtn"><span class="box"><svg viewBox="0 0 24 24"><polyline points="5 12.5 10 17 19 7.5" /></svg></span>Achsen beschriften (A, B mit Frequenz)</button>
      </div>

      <div class="group">
        <label class="slider">
          <span class="lbl">Lautstärke</span>
          <input type="range" id="volume" min="0" max="100" value="80" />
          <span class="val" id="volumeVal"></span>
        </label>
        <label class="slider">
          <span class="lbl">Grundton</span>
          <input type="range" id="base" min="0" max="1000" value="333" />
          <span class="val" id="baseVal"></span>
        </label>
        <label class="slider">
          <span class="lbl">Wabbeln</span>
          <input type="range" id="wobble" min="0" max="100" value="40" />
          <span class="val" id="wobbleVal"></span>
        </label>
      </div>

      <div class="group">
        <div class="glbl">Zeichnen</div>
        <div class="slider">
          <span class="lbl">Spur</span>
          <div class="seg small" id="trailSeg">
            <button data-trail="tail" class="on">Schweif</button>
            <button data-trail="keep">Bleibt</button>
          </div>
          <span class="val"></span>
        </div>
        <label class="slider tail-only">
          <span class="lbl">Schweif</span>
          <input type="range" id="tail" min="0" max="1000" value="572" />
          <span class="val" id="tailVal"></span>
        </label>
      </div>

      <p class="note">Grundton gedrückt halten = Ton A hören. iPhone: Stummschalter aus, sonst kein Ton.<br />Tasten: Leertaste Pause, H ausblenden, 1–9 Intervalle von 1:1 aufwärts.</p>
    </aside>

    <div class="zenhint" id="zenHint">Tippen zum Einblenden</div>

    <section class="panel ui" id="panel">
      <div class="panel-scroll" id="panelScroll">
        <div class="panel-main" id="panelMain">
          <div class="row main">
            <label class="slider tempo-row">
              <span class="lbl">Tempo</span>
              <input type="range" id="tempo" min="0" max="1000" value="250" aria-label="Tempo" />
              <span class="val" id="tempoVal"></span>
            </label>
            <div class="icons">
              <button class="icon" id="restartBtn" title="Neu zeichnen">
                <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></svg>
              </button>
              <button class="icon play on" id="playBtn" title="Pause / Weiter (Leertaste)">
                <svg class="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2" class="fill" /><rect x="13.9" y="5" width="3.6" height="14" rx="1.2" class="fill" /></svg>
                <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.2-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6z" class="fill" /></svg>
              </button>
              <button class="icon" id="zenBtn" title="Nur die Figur (H)">
                <svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9" /><polyline points="9 21 3 21 3 15" /><line x1="21" x2="14" y1="3" y2="10" /><line x1="3" x2="10" y1="21" y2="14" /></svg>
              </button>
            </div>
          </div>

          <div class="ratio-head">
            <label class="pill select left" title="Welche Intervalle als Buttons und Punkte erscheinen">
              <select id="filterSel" aria-label="Intervall-Filter"></select>
              <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9" /></svg>
            </label>
            <input id="ratio" value="2 : 3" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Verhältnis, zum Eintippen antippen" />
            <button class="pill on" id="snapBtn" title="Regler rastet an Intervallen ein">Einrasten</button>
          </div>

          <div class="rslider">
            <div class="marks" id="marks"></div>
            <input type="range" id="rslider" min="0" max="10000" value="5850" aria-label="Verhältnis" />
            <div class="ends"><span>1 : 1</span><span>1 : 2</span></div>
          </div>

          <div class="presets" id="presets"></div>
        </div>

        <div class="panel-more">
          <label class="slider">
            <span class="lbl">Phase</span>
            <input type="range" id="phase" min="0" max="360" value="0" aria-label="Phase" />
            <span class="val" id="phaseVal"></span>
          </label>

          <div class="glbl">Phasen-Mapping</div>
          <div class="seg small full" id="mapSeg">
            <button data-map="quick" class="on">Mitführen</button>
            <button data-map="responsive">Beim Ankommen</button>
            <button data-map="none">Aus</button>
          </div>
          <p class="note" id="mapNote"></p>
        </div>
      </div>
      <div class="more-hint" id="moreHint"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9" /></svg></div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
